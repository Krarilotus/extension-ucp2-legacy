Name: 非官方要塞十字军东征补丁
ai: AI
balance_changes: 平衡调整
bugfixes: 错误修复
fixes: 修复
improvements: 改进
misc: 杂项
qol: 体验优化
ai_housing: AI建造民房更加智能
ai_housing_descr: 让 AI 领主更合理地管理住房：调整停止建造新住房的条件，并防止 AI 拆除住房。这通常能让 AI 在游戏初期更快扩张，并更快获得新工人。
ai_build_housing: 调整供新农民入住的空余住房
ai_build_housing_descr: |-
  根据可供新农民入住的剩余空位，决定 AI 何时停止建造住房。原版数值为 0，因此 AI 只会在所有住房住满后建造新住房。
  此选项也会防止 AI 拆除多余住房。
ai_campfire_housing: 调整篝火旁空闲农民的容纳上限
ai_campfire_housing_descr: |-
  设置 AI 篝火旁农民的最大数量，达到该数量后 AI 将停止建造新住房。
  此选项也会防止 AI 拆除多余住房。
ai_delete_housing: 此选项仅防止 AI 拆除多余住房。
ai_demolish: 停用ai拆毁以下类型建筑来获取资金
ai_demolish_descr: AI 感到压力时，会拆除经济或防御建筑，快速筹钱招募部队。有时这一行为似乎没有明显原因，而且拆除这些建筑往往不是好策略。下列为筹钱而拆除建筑的行为可以关闭。
ai_demolish_eco: 经济建筑
ai_demolish_trapped: 无法到达的建筑
ai_demolish_walls: 防御工事
ai_access: 不拆除无通路建筑
ai_access_descr: ai会反复建造又拆除无通路但需要通路的建筑，打开此选项可以避免此问题。
ai_addattack: 调整ai每波进攻额外增加的兵力
ai_addattack_descr: 在原版，ai每波进攻都会额外增加5的兵力，这个同时生效于所有ai的数值可以在此处改变。
ai_addattack_alt_descr: |-
  或者，每波额外增加的兵力可以和ai初次进攻的兵力有关，对于不同ai来说，初次进攻兵力可以是不同的，因此这个选项可以使不同ai的进攻士兵增速不同。
  举例: 倍率 = 0.5
  苏丹从第一波开始的进攻士兵数量 = 10, 15, 20, 25, ...
  萨拉丁从第一波开始的进攻士兵数量 = 50, 75, 100, 125, ...
ai_assaultswitch: 进攻时不改变目标
ai_assaultswitch_descr: 当ai进攻时，如果目标发生改变，将会改变已派出部队的目标，比如ai目标若是最弱的敌人，当ai已派出进攻部队时，如果最弱的敌人改变了，将会改变进攻部队的路径转而攻击新目标。打开这个选项可以防止这种现象的发生。已派出的部队不会中途改变目标。
ai_attacklimit: 调整ai的进攻部队数量限制
ai_attacklimit_descr: |-
  AI 主攻部队上限为首次进攻兵力加上此值（原版为 200）。达到上限后，AI 停止招募并不再发动主攻。
  注意：数值过高时，长局可能达到全局单位上限，导致新农民无法出现。
ai_attacktarget: 设置ai的目标敌人
ai_attacktarget_descr: |-
  可以覆盖所有 AI 领主选择攻击目标的方式。
  注意：使用 aiSwapper 模块，可以在 AIC 中更细致地设置各个 AI 的目标选择行为。
ai_attacktarget_nearest: 最近的敌人
ai_attacktarget_richest: 最富有的敌人
ai_attacktarget_weakest: 最弱的敌人
ai_attackwave: 提升ai的进攻
ai_attackwave_descr: 原版进攻时每段城墙只派一名士兵，其余部队等待空位。启用后，多名士兵可同时攻击同一段城墙以更快破墙，也会攻击原先忽略的建筑和塔楼。城墙出现缺口后，所有剩余进攻部队会攻向敌方主堡。下方可设置破墙前攻击城堡外建筑的部队比例。
ai_buywood: 购买足够木头
ai_buywood_descr: ai购买木头用于建筑时，将会购买2根额外的木头，防止刚购买的木头被工人拿走使得木头不足以建造目标建筑。
ai_defense: 修复ai不会补充防守兵种
ai_defense_descr: 修复仍有防御巡逻队时，AI 无法补充城墙和塔楼守军的问题。
ai_fix_crusader_archers_pitch: 修复AI的欧洲弓箭手不会点燃沥青
ai_fix_crusader_archers_pitch_descr: AI的欧洲弓箭手可以和阿拉伯弓箭手一样点燃沥青。
ai_fix_laddermen_with_enclosed_keep: 修复了ai在城堡无通路时不使用云梯兵的错误
ai_fix_laddermen_with_enclosed_keep_descr: 当ai(尤其是蛇)在自己城堡无通路到外界时，不再会停止使用云梯兵。
ai_nosleep: 资源不足时ai不再休眠建筑
ai_nosleep_descr: ai通常会将正在生产中的建筑休眠，因为有部分建筑缺乏原料，哪怕原料正在运回的路上，打开此选项可以防止ai将建筑休眠。
ai_resources_rebuy: 改进AI补充所需物资
ai_resources_rebuy_descr: AI 即使有足够金币也常常不补充物资，导致生产线停摆。此选项缩短 AI 在库存耗尽后等待补充所需物资的时间。
ai_noflour_maxtime_descr: AI 补充 2 份面粉前的等待时间（单位：1/12 个月）。
ai_noiron_maxtime_descr: AI 补充 2 份铁前的等待时间（单位：1/12 个月）。
ai_nowood_maxtime_descr: AI 补充 5 份木材前的等待时间（单位：1/12 个月）。
ai_rebuild: 增强ai修复和建筑能力
ai_rebuild_descr: 打开后，ai将会在废墟中重建塔楼，修复微小损坏的城墙。工程师协会，隧道工协会，油锅被摧毁后，如果后半截仍然存在，打开后ai将可以正确重建。采石场被摧毁后，如果存放石头点仍然存在，打开后ai可以无视存放石头点放置建筑。
ai_recruitinterval: 加快所有ai的训练士兵速度
ai_recruitinterval_descr: 将所有ai的训练时间间隔降低至最低(老鼠和狮心王的程度)
ai_recruitstate_initialtimer: AI在初期阶段只招募防御士兵
ai_recruitstate_initialtimervalue_descr: 设置 AI 在游戏开始后仅招募防御部队的月数（除非防御部队已满编）。原版为 6 个月。
ai_tethers: 将每位 AI 领主的牛栏上限设为 10 个
ai_tethers_descr: 通常，AI 每建造一座新采石场都会新建一个牛栏，即使已超过每位领主通常 10 个牛栏的上限。这会导致牛栏泛滥并触及 AI 领主的人口上限，从而无法刷新新农民。启用此选项可禁止在新建采石场时放置这个额外的牛栏。
ai_towerengines: 提高 AI 塔楼攻城器械上限
ai_towerengines_descr: 通常，AI 在塔楼上最多只会建造 3 台投石机和 3 台弩炮。启用此选项后，每种器械的上限将提高至 5 台。
fix_apple_orchard_build_size: 修正苹果园建造时的面积
fix_apple_orchard_build_size_descr: 将建造时苹果园需求的面积修正为苹果园的实际面积，这也可以让AI正确的放置苹果园。
o_armory_marketplace_weapon_order_fix: 调整武器库和市场中武器的顺序
o_armory_marketplace_weapon_order_fix_descr: 调整了武器在武器库和市场中的排序，同时将皮甲移至链锤和弩之间，将铁甲移至戟和剑之间，使得在浏览时更方便。
o_change_siege_engine_spawn_position_catapult: 器械建造完成时将位于帐篷中央
o_change_siege_engine_spawn_position_catapult_descr: 器械建造完成时将不再位于帐篷的右上角，而是位于帐篷的中央。
o_default_multiplayer_speed: 设置多人游戏中的默认游戏速度
o_default_multiplayer_speed_descr: 允许设置默认多人游戏速度，加载存档时也会应用此速度，而非默认的 40。
o_disable_border_scrolling: 禁用屏幕边缘滚屏
o_disable_border_scrolling_descr: 鼠标移到屏幕边缘时，镜头不会滚动。适用于窗口模式下需要将鼠标移出游戏窗口的情况。
o_engineertent: 无需重复选择工程师帐篷类型
o_engineertent_descr: 打开这个选择之后，选择一次工程师帐篷类型后即可一直放置该类型的工程师帐篷，而不需要每次都再选择一次。
o_fast_placing: 连续放置常用建筑
o_fast_placing_descr: |-
  按住鼠标左键可连续放置以下建筑：
  陷阱坑、伐木屋、正面和负面声望设施、磨坊、水井、面包房和住房。
o_firecooldown: 调整刚灭火建筑的免疫火灾时间
o_firecooldown_descr: 灭火后的建筑无法再次起火的持续时间。原版为 2000 游戏刻，相当于 2 个半月。
o_fix_baker_disappear: 修复面包工人消失
o_fix_baker_disappear_descr: 当面包工人到达储存区却没有面粉时，不再会消失。
o_fix_fletcher_bug: 修复弓弩工人的路线
o_fix_fletcher_bug_descr: 现在弓弩工人在武器库放下弓弩后会直接去储存区拿原料，而不是先返回作坊。
o_fix_ladderclimb: 修复士兵爬上云梯后遗失目的地bug
o_fix_ladderclimb_descr: 士兵现在爬上云梯后将会记住目的地，而不会被困在云梯上。
o_fix_map_sending: 修复多人游戏地图发送
o_fix_map_sending_descr: 缩短发送时使用的地图名称，使多人游戏中可以再次发送地图。
o_fix_moat_digging_unit_disappearing: 修复挖河士兵消失
o_fix_moat_digging_unit_disappearing_descr: 挖河士兵在挖护城河时不再会随机消失。注意的是，当挖河士兵正好位于无通路地区时，如果你对其下达命令，他仍会消失！
o_fix_rapid_deletion_bug: 修复快速拆除建筑时重复返还资源
o_fix_rapid_deletion_bug_descr: 即使用连点器快速拆除建筑，同一座建筑也只会返还一次资源。
o_freetrader: 免费市场
o_freetrader_descr: 有时ai的市场被拆除且没有木头时，ai将会彻底瘫痪。使市场免费可以避免此问题。
o_gamespeed: 拓宽游戏速度限制
o_gamespeed_descr: |-
  游戏速度的限制更改为如下所示:
   - 在10到90之间以5为间隔
   - 在90到200之间以10为间隔
   - 在200到1000之间以100为间隔
  新的游戏速度范围仅可通过键盘上的+ -号来改变，菜单中的游戏速度调整不到新的范围。
o_healer: 医生会治愈伤员
o_healer_descr: 药房的医生现在会主动寻找并治疗受伤的士兵、攻城器械、平民和动物，优先治疗最近的目标。每次治疗动画约恢复长矛兵生命值的 1/3。游览花园和查看瘟疫云雾的行为不会改变，仅在附近仍有受伤目标时跳过城堡内巡游。
o_increase_path_update_tick_rate: 寻路检测频率增加
o_increase_path_update_tick_rate_descr: |-
  在原版，每200游戏刻会检测一次可行通路，经常导致ai的单位在摧毁了敌人的城门或者塔楼时不能立刻进入城堡。

  打开后，每50个游戏刻就会进行一次检测，使得单位的反应速度加快。
o_keys: WASD键移动以及Ctrl+S/L键保存读取
o_keys_descr: 可使用 WASD 移动镜头，Ctrl+S 快速保存，Ctrl+L 快速读取。注意：启用后将影响输入地图说明和用 A 键选择武器库。
o_moatvisibility: 一直显示规划中的护城河
o_moatvisibility_descr: 你将可以一直看到规划中的护城河，而不需要点选单位。
o_onlyai: 打开观察者模式
o_onlyai_descr: 移除第一位的人类玩家，让你以旁观视角观看最多 8 个 AI 对战而不受干扰。存档可以正常读取，但其中原有的人类玩家将无法操作。偶尔会出现地图各处随机生成物体的现象，这仅是显示问题，保存游戏、结束任务后再读取存档即可消除。
o_override_identity_menu: 在设置菜单里添加一些新的选择
o_override_identity_menu_descr: 增加了玩家初始兵种的选择的功能，只在普通模式下生效。
o_playercolor: 改变玩家1号的颜色
o_playercolor_descr: 将该槽位的颜色与红色互换，使玩家可以使用自己想要的颜色；此处选择红色无效。
o_remove_right_click_context_menu: 移除右键菜单
o_remove_right_click_context_menu_descr: 移除可旋转地图、降低城墙显示高度、缩放和平整视图的右键菜单。
o_responsivegates: 城门快速反应
o_responsivegates_descr: 敌人在靠近城门一定距离时城门将会关闭，该距离由 200 调整至 140。附近没有敌人后城门自动重新开启的延迟时间由 1200 游戏刻缩短至 100 游戏刻。
o_restore_arabian_engineer_speech: 工程师切换为阿拉伯语音
o_restore_arabian_engineer_speech_descr: 当玩家使用阿拉伯领主时，工程师的语音将会切换为阿拉伯语。
o_shfy: 要塞修改
o_shfy_descr: |-
  将所列项目调整为 Stronghold 1 的平衡设置。
  注意：每项改动也会影响 AI 领主，最坏情况下可能使其无法正常发挥作用！
o_shfy_beer: 从啤酒中获取的声望
o_shfy_peasantspawnrate: 农民产生速度
o_shfy_religion: 从宗教中获取的声望
o_shfy_resourcequantity: 交付资源数量
o_stop_player_keep_rotation: 玩家的大本营会根据所处地图方位进行旋转
o_stop_player_keep_rotation_descr: 玩家的大本营将可以和AI一样，会根据所处地图方位进行旋转，使篝火处永远背向地图中央。
o_xtreme: 移除增强版的技能条
u_arabwall: 阿拉伯剑士破坏城墙速度加快
u_arabwall_descr: 在原版，阿拉伯剑士破坏城墙的速度比其他任何单位都要更慢，打开这个选项后，破坏速度将会提升为原来的两倍，稍快于长矛手。
u_arabxbow: 增强了阿拉伯剑士抵抗弩箭的能力
u_arabxbow_descr: ' -阿拉伯剑士在中3发弩箭后死亡改为6发弩箭后死亡。'
u_fireballistafix: 巨火弩正确攻击僧侣和隧道工
u_fix_applefarm_blocking: 修复苹果园工人被堵路
u_fix_applefarm_blocking_descr: 当农场的左上方被建筑堵住时，将不再阻止苹果园工人进入苹果园。
u_fix_lord_animation_stuck_movement: 修正领主摧毁建筑物后的人物动画
u_fix_lord_animation_stuck_movement_descr: 修正了领主的姿势，当领主停止移动或者摧毁一个建筑物后，他将会站立，而不是被卡在地上。
u_laddermen: 增强云梯兵对于箭矢的抗性
u_laddermen_descr: |-
  - 云梯兵承受 12 支弓箭才会阵亡，原版为 5 支
  - 云梯兵承受 5 次弩箭或投石兵攻击才会阵亡，原版为 2 次
  - 云梯兵费用由 4 金币提高至 20 金币
u_spearmen: 增强长矛手抵抗箭矢的能力
u_spearmen_descr: |2-
   - 长矛手在中3发箭后死亡改为5发箭后死亡，
   - 长矛手承受1发弩箭后还可以刚好存活。
u_spearmen_run: 矛兵默认为奔跑状态而不是步行
u_spearmen_run_descr: 矛兵在默认状态下将使用奔跑作为移动方式，而不是步行。
u_tanner_fix: 修复所有皮革工人获取同一头牛
u_tanner_fix_descr: 现在皮革工人到达牧场后，若发现想要牵走的牛已被其他工人牵去，会转而去牵另外一头牛，而不是直接回到作坊。极大提高皮革作坊的效率。
ui.red: 红色
ui.orange: 橙色
ui.yellow: 黄色
ui.blue: 蓝色
ui.black: 黑色
ui.purple: 紫色
ui.lightblue: 浅蓝色
ui.green: 绿色
