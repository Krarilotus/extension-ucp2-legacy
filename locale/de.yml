Name: Inoffizieller Crusader Patcher
ai: KI
balance_changes: Balance-Änderungen
bugfixes: Fehlerkorrekturen
fixes: Fehlerbehebungen
improvements: Verbesserungen
misc: Sonstiges
qol: Komfortfunktionen
ai_housing: Intelligenteres Errichten und Abreißen von Häusern
ai_housing_descr: 'Lässt KI-Fürsten ihre Wohnhäuser sinnvoller verwalten: Die Kriterien zum Beenden des Hausbaus lassen sich anpassen, und das Abreißen von Wohnhäusern wird verhindert. Dadurch können die KIs zu Spielbeginn meist schneller wachsen und neue Arbeiter erhalten.'
ai_build_housing: Freien Wohnraum für neue Bauern anpassen
ai_build_housing_descr: |-
  Legt anhand der noch freien Plätze für neue Bauern fest, wann KIs keine weiteren Häuser bauen. Im Originalspiel ist dieser Wert 0: Neue Häuser werden erst gebaut, wenn alle vorhandenen bewohnt sind.
  Diese Option verhindert außerdem, dass KIs ihre zusätzlichen Häuser abreißen.
ai_campfire_housing: Platz für untätige Bauern am Lagerfeuer anpassen
ai_campfire_housing_descr: |-
  Legt die maximale Anzahl von Bauern am Lagerfeuer einer KI fest, ab der sie keine weiteren Häuser baut.
  Diese Option verhindert außerdem, dass KIs ihre zusätzlichen Häuser abreißen.
ai_delete_housing: Diese Option verhindert ausschließlich, dass KIs ihre zusätzlichen Häuser abreißen.
ai_demolish: Einreißen für Geld der KI-Lords deaktivieren
ai_demolish_descr: Fühlen sich KIs bedrängt, reißen sie Wirtschafts- oder Befestigungsgebäude ab, um schnell Geld für Truppen zu erhalten. Dies geschieht manchmal ohne erkennbaren Grund und ist häufig eine schlechte Strategie. Die folgenden Arten des Gebäudeabrisses zur Geldbeschaffung können deaktiviert werden.
ai_demolish_eco: Wirtschaftsgebäude
ai_demolish_trapped: Falls eingeschlossen
ai_demolish_walls: Befestigungsanlagen
ai_access: Kein Abreißen von unzugänglichen Gebäuden
ai_access_descr: Verhindert, dass die KI Gebäude abreißt zu denen es keinen Zuweg gibt. Damit soll der Bug verhindert werden, bei dem manche KIs in ihren Burgen andauernd Gebäude abreißen und wieder aufbauen zu denen es keinen Weg gibt.
ai_addattack: Erhöhung der Rate von zusätzlichen Angriffstruppen
ai_addattack_descr: In Vanilla wird nach jedem Angriff die Truppenzahl für den nächsten Angriff durchschnittlich um 5 Einheiten erhöht. Dieser Wert ist für alle KI-Lords gleich und kann hier geändert werden.
ai_addattack_alt_descr: |-
  Alternativ kann hier die hinzukommende Truppenanzahl von der Truppenstärke des ersten Angriffs abhängig gemacht werden. Da jede KI unterschiedliche Anzahlen für den Erstangriff hat, werden somit auch folgende Angriffe skalieren, anstatt für jede KI gleich anzusteigen.
  Beispiel: Skalierungsfaktor = 0,5
  Sultans Angriffszahlen = 10, 15, 20, 25, ...
  Saladins Angriffszahlen = 50, 75, 100, 125, ...
ai_assaultswitch: Kein KI-Angriffszielwechsel während Belagerung
ai_assaultswitch_descr: KI-Lords, die den reichsten oder schwächsten Gegner angreifen, behalten ihr Ziel während der Belagerung bei. Vor Angriffsbeginn können sie es beim Sammeln noch wechseln.
ai_attacklimit: Erhöhung des Angriffstruppenlimits der KIs
ai_attacklimit_descr: |-
  Die Obergrenze für die Hauptarmee der KI ist die Stärke ihres ersten Angriffs plus dieser Wert (im Original: 200). Am Limit stellt die KI Rekrutierung und Hauptangriffe ein.
  HINWEIS: Sehr hohe Werte können in längeren Partien das globale Einheitenlimit erreichen, sodass keine neuen Bauern mehr erscheinen.
ai_attacktarget: AI-Angriffsziel einstellen
ai_attacktarget_descr: |-
  Überschreibt, wie alle KI-Fürsten ihre Angriffsziele auswählen.
  HINWEIS: Mit dem Modul aiSwapper lässt sich das Zielwahlverhalten einzelner KIs genauer über ihre AIC-Einstellungen festlegen.
ai_attacktarget_nearest: Nahegelegenster Gegner
ai_attacktarget_richest: Reichster Gegner
ai_attacktarget_weakest: Schwächster Gegner
ai_attackwave: Angriffswellen verbessern
ai_attackwave_descr: |-
  Im Originalspiel schickt die KI pro Mauerstück nur einen Soldaten; die übrigen Truppen warten, bis ein Platz frei wird.
  Mit dieser Option greifen mehrere Einheiten dasselbe Mauerstück an und attackieren auch zuvor ignorierte Gebäude und Türme. Sobald eine Bresche offen ist, schickt die KI alle übrigen Angriffstruppen zum gegnerischen Bergfried.
  Unten stellst du ein, welcher Anteil der Truppen vor einer Bresche Gebäude außerhalb der Burg angreift:
ai_buywood: Genügend Holz kaufen
ai_buywood_descr: Damit Bogenmacher etc. nicht ständig gekauftes Bauholz wegschnappen, kauft die KI mit dieser Einstellung immer 2 Holz mehr als nötig für Gebäude.
ai_defense: Verstärkung der Burgverteidigung fixen
ai_defense_descr: Fixt den Bug, der die KI davon abhielt, fehlende Truppen auf Wällen und Türmen zu verstärken solange noch Defensivpatrouillien vorhanden waren.
ai_fix_crusader_archers_pitch: Europäische Bogenschützen der KI entzünden Pech.
ai_fix_crusader_archers_pitch_descr: Bisher waren nur Arabische Bogenschützen der KIs in der Lage Pechgraben mit Feuerpfeilen zu entzünden; nun können dies auch Europäischen Bogenschützen.
ai_fix_laddermen_with_enclosed_keep: Korrigiert Leiternutzung
ai_fix_laddermen_with_enclosed_keep_descr: Mit diesem Fix können Belagerungseinheiten von KIs, deren Bergfried abgeschlossen ist, weiterhin die Leitern der Leiterträger nutzen (betrifft vanilla nur die Schlange).
ai_nosleep: Schlafenlegen bei Rohstoffmangel deaktivieren
ai_nosleep_descr: Normalerweise legt die KI ihre Verarbeitungsgebäude schlafen, sobald der nötige Rohstoff nicht mehr im Lager vorhanden ist. Dabei wird keine Rücksicht genommen ob Produkte verloren gehen die z.B. gerade zur Waffenkammer gebracht werden. Diese Funktion kann hier komplett deaktiviert werden.
ai_resources_rebuy: KI-Nachkauf benötigter Waren verbessern
ai_resources_rebuy_descr: Die KI kauft oft keine Waren nach, selbst wenn sie genug Gold hat, sodass ihre Produktionsketten leerlaufen. Diese Option verkürzt die Wartezeit bei leerem Lager, bis die KI benötigte Waren nachkauft.
ai_noflour_maxtime_descr: Zeit in Zwölftelmonaten, bis die KI 2 Mehl nachkauft.
ai_noiron_maxtime_descr: Zeit in Zwölftelmonaten, bis die KI 2 Eisen nachkauft.
ai_nowood_maxtime_descr: Zeit in Zwölftelmonaten, bis die KI 5 Holz nachkauft.
ai_rebuild: Verbessertes KI-Reparieren
ai_rebuild_descr: Mit dieser Einstellung reparieren KI-Lords auch Turmruinen, leicht angeschlagene Mauern, sowie Baumeister-, Tunnelgilden und Ölkessel bei denen der Sammelplatz übergeblieben ist. Weiterhin kann die KI nun auch die Sammelstelle von Steinbrüchen überbauen.
ai_recruitinterval: Erhöhtes Rekrutierungstempo
ai_recruitinterval_descr: Setzt das Rekrutierungsintervall aller KIs auf den niedrigsten Wert. (Ratte/Richard-Niveau)
ai_recruitstate_initialtimer: Setzt den Zeitpunkt, ab dem KIs anhand der AIC rekrutieren
ai_recruitstate_initialtimervalue_descr: Anzahl an Monaten, ab der die KI anhand der in der AIC festgelegten Rekrutierungswahrscheinlichkeiten rekrutiert. Bis dahin rekrutiert sie ausschließlich Defensivtruppen bis diese vollständig sind und daraufhin Angriffstruppen.
ai_tethers: Ochsenjoche auf maximal 10 pro KI-Lord begrenzen
ai_tethers_descr: Normalerweise baut die KI für jeden neuen Steinbruch ein weiteres Ochsenjoch, selbst wenn das übliche Limit von 10 Ochsenjochen pro Lord überschritten wird. Dadurch können zu viele Ochsenjoche entstehen, das Bevölkerungslimit des KI-Lords erreicht werden und keine neuen Bauern mehr erscheinen. Mit dieser Einstellung lässt sich das Platzieren dieses zusätzlichen Ochsenjochs beim Bau eines neuen Steinbruchs deaktivieren.
ai_towerengines: Limit für Belagerungsgeräte auf KI-Türmen erhöhen
ai_towerengines_descr: Normalerweise baut die KI maximal je drei Mangen und Ballisten auf ihren Türmen. Mit dieser Option wird dieses Limit auf 5 pro Gerät erhöht.
fix_apple_orchard_build_size: Reduziert die Baugröße von Apfelfarmen
fix_apple_orchard_build_size_descr: Ändert die Bauvorschau von Apfelfarmen auf die Größe, die sie nach der Platzierung der Farm haben.
o_armory_marketplace_weapon_order_fix: Vereinheitlicht Waffenreihenfolge
o_armory_marketplace_weapon_order_fix_descr: Vereinheitlicht Waffenreihenfolge in Waffenkammer und Marktplatz. Es befinden sich nun Lederrüstungen zwischen Streitkolben und Armbrüste, und Rüstungen zwischen Piken und Schwertern für einfacheres Scrollen im Marktplatz.
o_change_siege_engine_spawn_position_catapult: Belagerungsgeräte in der Mitte des Zelts aufbauen
o_change_siege_engine_spawn_position_catapult_descr: Belagerungsgeräte erscheinen nun nach dem Aufbauen am Punkt der Zeltmitte, statt wie bisher in der oberen rechten Ecke des Zelts.
o_default_multiplayer_speed: Setzt Mehrspieler Standardgeschwindigkeit
o_default_multiplayer_speed_descr: Legt die Standard-Spielgeschwindigkeit im Mehrspielermodus fest, die auch beim Laden einer Partie statt der Standardgeschwindigkeit 40 verwendet wird.
o_disable_border_scrolling: Deaktiviere Scrollen am Bildschirmrand
o_disable_border_scrolling_descr: Bewegen des Mauszeigers zum Bildschirmrand bewegt nicht mehr die Ansicht.
o_engineertent: Belagerungsgeräte nicht automatisch abwählen
o_engineertent_descr: Mit dieser Einstellung wird das zuletzt zum Bau ausgewählte Belagerungsgerät bei Baumeistern nicht abgewählt, sodass man mehrere Zelte nacheinander bauen kann, ohne jedes mal neu wählen zu müssen.
o_fast_placing: Fast placing
o_fast_placing_descr: |-
  Bei gedrückter linker Maustaste werden folgende Gebäude fortlaufend platziert:
  Mördergruben, Holzfällerhütten, gute und schlechte Dinge, Mühlen, Wassertröge, Bäckereien und Wohnhäuser.
o_firecooldown: Feuerfeste Zeit gelöschter Gebäude anpassen
o_firecooldown_descr: Die Zeitspanne, in der gelöschte Gebäude nicht erneut Feuer fangen können. Im Originalspiel beträgt die Dauer 2000 Spiel-Ticks, was zweieinhalb Monaten entspricht.
o_fix_baker_disappear: Behebt das Verschwinden von Bäckern
o_fix_baker_disappear_descr: Behebt den Fehler, der Bäcker verschwinden ließ, wenn sie kein Mehl am angestrebten Platz im Vorratslager vorfinden konnten.
o_fix_fletcher_bug: Entfernt den Extraweg des Pfeilmachers zur Werkstatt
o_fix_fletcher_bug_descr: Passt das Verhalten des Pfeilmachers an andere Waffenproduzenten an. Nach Abgabe seines Gutes geht er nun direkt zum Vorratslager, statt erneut zur Werkstatt zurückzukehren.
o_fix_ladderclimb: Behebt Befehlsverlust beim Klettern auf Leitern
o_fix_ladderclimb_descr: Einheiten klettern nicht mehr direkt zurück und vergessen auch nicht mehr ihr Ziel, nachdem sie eine Leiter erklommen haben.
o_fix_map_sending: Enable map sending in multiplayer
o_fix_map_sending_descr: Reduces the length of the sent map name, to make map sending possible again!
o_fix_moat_digging_unit_disappearing: Behebt das Verschwinden von Buddeleinheiten.
o_fix_moat_digging_unit_disappearing_descr: Behebt das Verschwinden von Truppen, die mit dem Ausheben von Burggräben beschäftigt sind. Diese verschwinden allerdings weiterhin, falls diese neue Befehle bekommen und zeitgleich auf unbegehbarem Terrain stehen.
o_fix_rapid_deletion_bug: Fix resources rapid deletion
o_fix_rapid_deletion_bug_descr: Deleting buildings with a fast auto clicker no longer gives resources for more than one deletion.
o_freetrader: Kostenloser Marktplatz
o_freetrader_descr: Macht den Bau des Marktplatzes kostenlos, damit die KI sich ohne Rohstoffe für einen Marktplatz nicht selbst blockiert. Im Mehrspielermodus erspart das einen Neustart oder das Abreißen von Gebäuden für Holz, wenn der Marktplatz vergessen wurde.
o_gamespeed: Erweiterte Spielgeschwindigkeitsgrenzen
o_gamespeed_descr: |-
  Die Spielgeschwindigkeit kann nun wie folgt geändert werden:
   - Von 10 bis 90 in 5er Schritten
   - Von 90 bis 200 in 10er Schritten
   - Von 200 bis 1000 in 100er Schritten
  Die neuen Werte sind nur im Spiel über die +- Tasten erreichbar, der Regler im Spielmenü bleibt ungeändert.
o_healer: Heiler verarztet Verwundete
o_healer_descr: Der Heiler des Apothekengebäudes sucht nun verletzte Soldaten, Belagerungsgeräte, Zivilisten und Tiere auf und heilt sie. Nahe Ziele werden dabei bevorzugt. Mit jeder Heilungsanimation wird etwa 1/3 des Lebens eines Lanzenträgers geheilt. Das Schlendern durch die Gärten und Aufsuchen von Pestwolken bleibt erhalten. Nur das Schlendern durch die Burg wird ausgelassen, bis keine Verwundeten mehr in der Nähe sind.
o_increase_path_update_tick_rate: Suche öfter nach verfügbaren Wegen
o_increase_path_update_tick_rate_descr: Das Spiel überprüft nun viermal so häufig, welche Bereiche der Karte verbunden sind. Dadurch können beispielsweise nach der Zerstörung eines Torhauses oder eines Turmes die Truppen schneller ins Innere einer zuvor unzugänglichen Burg beordert werden.
o_keys: WASD-Tasten und Quicksaves
o_keys_descr: |-
  Mit dieser Einstellung werden die WASD-Tasten für die Kamera aktiviert.
  Außerdem kann mit STRG-S und STRG-L ein Quicksave erstellt und geladen werden.
o_moatvisibility: Geplanten Burggraben immer zeigen
o_moatvisibility_descr: Mit dieser Einstellung wird der gesetzte, aber noch nicht ausgehobene Burggraben immer angezeigt, auch wenn man die Burggrabenplatzierung abwählt.
o_onlyai: Zuschauer-Modus aktivieren [bug möglich]
o_onlyai_descr: Entfernt den menschlichen Spieler aus Platz 1, sodass du Partien mit bis zu 8 KIs ungestört beobachten kannst. Spielstände laden in diesem Modus korrekt; war ein Mensch dabei, lässt sich dessen Platz jedoch nicht steuern. Gelegentlich erscheinen zufällige Objekte auf der Karte – das ist nur ein Darstellungsfehler und lässt sich durch Speichern, Mission beenden und Neuladen beheben.
o_override_identity_menu: Fügt neue Optionen zum Menüpunkt 'Identität zulegen' hinzu
o_override_identity_menu_descr: Im Menüpunkt 'Identität zulegen' kann man nun die Starteinheiten für 'Normales Spiel' ändern
o_playercolor: Farbe von Spieler 1 wechseln
o_playercolor_descr: Tauscht die Farbe des anderen Spielerslots mit Rot, damit der Spieler seine Wunschfarbe spielen kann. Die Auswahl von Rot hat hier keine Wirkung.
o_remove_right_click_context_menu: Rechtsklick-Kontextmenü entfernen
o_remove_right_click_context_menu_descr: Removes right click context menu where you can rotate the map, lower walls, zoom and flatten.
o_responsivegates: Torhäuser schneller auf Gegner reagieren lassen
o_responsivegates_descr: Torhäuser schließen sich jetzt später bei Gegnernähe und öffnen wieder schneller automatisch, sobald die Gefahr vorüber ist. Die Distanz die ein Gegner haben muss, damit sich das Tor automatisch schließt, wird von 200 auf 140 gesenkt. Die Zeit nach der sich das Tor wieder öffnet, sofern kein Gegner mehr in der Nähe ist, wird von 1200 auf 100 reduziert.
o_restore_arabian_engineer_speech: Baumeister arabischer Lords sprechen Arabisch
o_restore_arabian_engineer_speech_descr: Falls der Spieler den arabischen Lord auswählt nutzen Baumeister nun ihre arabischen Sprachdateien.
o_shfy: Strongholdify
o_shfy_descr: |-
  Passt die aufgeführten Aspekte an die Balance von Stronghold 1 an.
  Achtung: Jede Änderung betrifft auch die KI-Fürsten und kann sie im schlimmsten Fall handlungsunfähig machen!
o_shfy_beer: Beliebtheitsbonus durch Bier
o_shfy_peasantspawnrate: Spawngeschwindigkeit Bauern
o_shfy_religion: Beliebtheitsbonus Kathedrale und Kirche
o_shfy_resourcequantity: Anzahl der gelieferten Resourcen
o_stop_player_keep_rotation: Drehe Spielerbergfriede wie die der KIs
o_stop_player_keep_rotation_descr: Die Bergfriede der Spieler richten sich nun so aus wie die der KI; sie drehen sich so, dass das Lagerfeuer in Richtung des Kartenrands zeigt.
o_xtreme: Magie-Leiste in Extreme entfernen.
u_arabwall: Arabische Schwertkämpfer zerstören Mauern schneller
u_arabwall_descr: Im Originalspiel zerstören arabische Schwertkämpfer Mauern langsamer als jede andere Nahkampfeinheit. Diese Option verdoppelt ihre Geschwindigkeit ungefähr, sodass sie Mauern etwas schneller als Speerträger zerstören.
u_arabxbow: Mehr Schutz für arabische Schwertkämpfer gegen Armbrustbolzen
u_arabxbow_descr: ' - Arabische Schwertkämpfer sterben erst nach 6 Armbrusttreffern statt 3'
u_fireballistafix: Feuerballisten schießen auf Mönche und Tunnelgräber
u_fix_applefarm_blocking: Behebt das Blockieren des Apfelfarmers
u_fix_applefarm_blocking_descr: Apfelfarmer werden nicht länger inaktiv, wenn der Pfad links oben direkt neben der Farm blockiert wird.
u_fix_lord_animation_stuck_movement: Setzt die Lordanimation nach Zerstörung von Gebäuden zurück
u_fix_lord_animation_stuck_movement_descr: Der Lord wechselt mit dieser Änderung nach dem Zerstören eines Gebäudes in seine Ausgangsposition. Bisher blieb er in der Zerstöranimation stecken.
u_laddermen: Erhöhter Schutz für Leiterträger gegen Fernkämpfer
u_laddermen_descr: |2-
   - Leiterträger sterben erst nach 12 Pfeiltreffern statt 5
   - Leiterträger sterben erst nach 5 Armbrust- oder Schleudertreffern statt 2
   - Leiterträger kosten 20 Gold statt 4
u_spearmen: Erhöhter Schutz von Lanzenträger gegen Fernkämpfer
u_spearmen_descr: |2-
   - Lanzenträger sterben erst nach 5 Pfeiltreffern statt 3
   - Lanzenträger überleben knapp einen Armbrusttreffer
u_spearmen_run: Speerträger rennen standardmäßig
u_spearmen_run_descr: Speerträger rennen standardmäßig so schnell wie Sklaven und Streitkolbenkämpfer.
u_tanner_fix: Gerberinnen holen sich unterschiedliche Kühe
u_tanner_fix_descr: Gerberinnen kehren nicht länger ohne Kuh zurück, falls ihre anvisierte Kuh bereits weg ist. Sie warten nun, bis sie eine andere Kuh mitnehmen können.
ui.red: Rot
ui.orange: Orange
ui.yellow: Gelb
ui.blue: Blau
ui.black: Schwarz
ui.purple: Violett
ui.lightblue: Hellblau
ui.green: Grün
