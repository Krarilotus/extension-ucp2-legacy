Name: وصلهٔ غیررسمی Crusader
ai: هوش مصنوعی
balance_changes: تغییرات توازن
bugfixes: رفع خطاها
fixes: اصلاحات
improvements: بهبودها
misc: متفرقه
qol: سهولت استفاده
ai_housing: مدیریت هوشمندتر مسکن
ai_housing_descr: با تنظیم شرایط توقف ساخت خانه و جلوگیری از تخریب خانه‌ها، به اربابان هوش مصنوعی امکان می‌دهد مسکن
  را بهتر مدیریت کنند. این کار معمولاً باعث گسترش سریع‌تر و ورود زودتر کارگران جدید در آغاز بازی می‌شود.
ai_build_housing: تنظیم فضای خالی برای ورود رعیت‌های جدید
ai_build_housing_descr: 'تعیین می‌کند هوش مصنوعی بر اساس ظرفیت خالی باقی‌مانده برای رعیت‌های جدید چه زمانی ساخت
  خانه را متوقف کند. در بازی اصلی این مقدار صفر است؛ بنابراین فقط پس از پرشدن همهٔ خانه‌ها، خانهٔ جدید ساخته می‌شود.

  این گزینه همچنین مانع تخریب خانه‌های اضافی توسط هوش مصنوعی می‌شود.'
ai_campfire_housing: تنظیم ظرفیت رعیت‌های بیکار کنار آتش
ai_campfire_housing_descr: 'بیشترین تعداد رعیت کنار آتش هوش مصنوعی را پیش از توقف ساخت خانه تنظیم می‌کند.

  این گزینه همچنین مانع تخریب خانه‌های اضافی توسط هوش مصنوعی می‌شود.'
ai_delete_housing: این گزینه فقط از تخریب خانه‌های اضافی توسط هوش مصنوعی جلوگیری می‌کند.
ai_demolish: تخریب ساختمان برای به‌دست‌آوردن پول
ai_demolish_descr: وقتی هوش مصنوعی احساس فشار می‌کند، ساختمان‌های اقتصادی یا دفاعی را خراب می‌کند تا سریع برای سربازگیری
  پول به دست آورد. این رفتار گاهی بدون دلیل آشکار رخ می‌دهد و اغلب راهبرد مناسبی نیست. می‌توان انواع زیر از تخریب
  برای پول را غیرفعال کرد.
ai_demolish_eco: ساختمان‌های اقتصادی
ai_demolish_trapped: ساختمان‌های دسترس‌ناپذیر
ai_demolish_walls: ساختمان‌های دفاعی
ai_access: جلوگیری از تخریب ساختمان‌های دسترس‌ناپذیر
ai_access_descr: هوش مصنوعی دیگر ساختمان‌هایی را که کارگر نمی‌تواند به آن‌ها برسد، پی‌درپی خراب و دوباره بنا نمی‌کند.
ai_addattack: تغییر افزایش ارتش در هر موج حمله
ai_addattack_descr: در بازی اصلی هر ارباب هوش مصنوعی با هر حملهٔ اصلی ۵ سرباز به ارتش خود اضافه می‌کند. این مقدار
  را می‌توانید اینجا تنظیم کنید.
ai_addattack_alt_descr: 'همچنین می‌توان افزایش ارتش را درصدی از اندازهٔ ارتش اولیه تعیین کرد که برای هر ارباب متفاوت
  است.

  نمونه: ضریب مقیاس = 0.5

  نیروهای حملهٔ سلطان = 10, 15, 20, 25, ...

  نیروهای حملهٔ صلاح‌الدین = 50, 75, 100, 125, ...'
ai_assaultswitch: جلوگیری از تغییر هدف هوش مصنوعی هنگام محاصره
ai_assaultswitch_descr: هوش‌هایی که ثروتمندترین یا ضعیف‌ترین دشمن را هدف می‌گیرند، گاهی در میانهٔ محاصره هدف را
  دوباره ارزیابی می‌کردند و نیروها را به سوی دیگر نقشه می‌فرستادند. با این اصلاح، هدف انتخاب‌شدهٔ قبلی حفظ می‌شود.
ai_attacklimit: تنظیم سقف سربازگیری تهاجمی هوش مصنوعی
ai_attacklimit_descr: 'تعداد نیروهای ارتش اصلی هوش مصنوعی به اندازهٔ حملهٔ نخست به‌علاوهٔ این مقدار محدود است؛ مقدار
  اضافی در بازی اصلی ۲۰۰ است. پس از رسیدن به سقف، سربازگیری و حمله‌های اصلی متوقف می‌شوند.

  نکته: مقادیر بسیار زیاد ممکن است در بازی‌های طولانی سقف کلی واحدها را پر کنند و مانع ورود رعیت‌های جدید شوند.'
ai_attacktarget: بازنویسی هدف‌های حملهٔ هوش مصنوعی
ai_attacktarget_descr: 'می‌توانید روش انتخاب هدف حمله را برای همهٔ اربابان هوش مصنوعی تغییر دهید.

  نکته: با ماژول aiSwapper می‌توان رفتار انتخاب هدف هر هوش مصنوعی را جداگانه و دقیق‌تر در AIC تنظیم کرد.'
ai_attacktarget_nearest: نزدیک‌ترین دشمن
ai_attacktarget_richest: ثروتمندترین دشمن
ai_attacktarget_weakest: ضعیف‌ترین دشمن
ai_attackwave: حمله‌های فعال‌تر هوش مصنوعی
ai_attackwave_descr: 'در بازی اصلی هوش مصنوعی برای هر قطعهٔ دیوار فقط یک سرباز می‌فرستد. اگر تعداد نیروها بیشتر
  از قطعات در دسترس باشد، بقیه منتظر خالی‌شدن یک قطعه می‌مانند.

  این گزینه اجازه می‌دهد چند نیرو هم‌زمان به هر قطعه حمله کنند تا زودتر تخریب شود، و به ساختمان‌ها و برج‌هایی که
  قبلاً نادیده می‌گرفتند نیز حمله کنند.

  همچنین پس از شکستن دیوارها، همهٔ نیروهای تهاجمی باقی‌مانده به سوی قلعهٔ مرکزی دشمن فرستاده می‌شوند.

  درصد نیروهایی را که پیش از ایجاد شکاف به ساختمان‌های بیرون قلعه حمله می‌کنند، در پایین تنظیم کنید.'
ai_buywood: خرید چوب اضافی
ai_buywood_descr: در بازی اصلی هوش مصنوعی هنگام ساخت بنا فقط به‌اندازهٔ هزینهٔ همان بنا چوب می‌خرد. این کار برای
  تولید سلاح که چوب مصرف می‌کند ذخیره‌ای باقی نمی‌گذارد. برای جلوگیری از مشکل، در این حالت ۲ واحد چوب بیشتر خریداری
  می‌شود.
ai_defense: جایگزینی مطمئن‌تر مدافعان قلعه
ai_defense_descr: خطایی را رفع می‌کند که تا وقتی گشت‌های دفاعی وجود داشتند، مانع جایگزینی نیروهای ازدست‌رفتهٔ دیوارها
  و برج‌ها می‌شد.
ai_fix_crusader_archers_pitch: اجازهٔ آتش‌زدن قیر به کمانداران اروپایی
ai_fix_crusader_archers_pitch_descr: کمانداران اروپایی هوش مصنوعی هنگام دفاع در برابر دشمن مانند کمانداران عرب قیر
  را آتش می‌زنند.
ai_fix_laddermen_with_enclosed_keep: اجازهٔ استفاده از نردبان‌دار به هوش‌های محصور
ai_fix_laddermen_with_enclosed_keep_descr: هوش مصنوعی دیگر به‌خاطر محصوربودن قلعهٔ خودش، حملهٔ نردبان‌داران به دیوارهای
  دشمن را متوقف نمی‌کند.
ai_nosleep: غیرفعال‌کردن خواب ساختمان‌های تولیدی
ai_nosleep_descr: 'اربابان هوش مصنوعی هنگام تمام‌شدن یک منبع لازم، ساختمان‌های تولیدی مربوط را به خواب می‌برند؛
  مثلاً وقتی آرد صلاح‌الدین تمام شود، همهٔ نانوایی‌ها متوقف می‌شوند.

  این رفتار اغلب کالاهای در حال تولید یا حمل را نادیده می‌گیرد و باعث اتلاف مداوم می‌شود.

  در اینجا می‌توانید حالت خواب را برای هوش مصنوعی کاملاً غیرفعال کنید.'
ai_resources_rebuy: بهبود تأمین دوبارهٔ کالاهای موردنیاز هوش مصنوعی
ai_resources_rebuy_descr: هوش مصنوعی اغلب با وجود طلای کافی کالاها را دوباره نمی‌خرد و زنجیره‌های تولیدش متوقف می‌شوند.
  این گزینه مدت انتظار با انبار خالی را پیش از خرید کالاهای لازم کوتاه می‌کند.
ai_noflour_maxtime_descr: زمان تا خرید دوبارهٔ ۲ واحد آرد توسط هوش مصنوعی، بر حسب یک‌دوازدهم ماه.
ai_noiron_maxtime_descr: زمان تا خرید دوبارهٔ ۲ واحد آهن توسط هوش مصنوعی، بر حسب یک‌دوازدهم ماه.
ai_nowood_maxtime_descr: زمان تا خرید دوبارهٔ ۵ واحد چوب توسط هوش مصنوعی، بر حسب یک‌دوازدهم ماه.
ai_rebuild: بهبود تعمیرات هوش مصنوعی
ai_rebuild_descr: هوش مصنوعی خرابهٔ برج‌ها و دیوارهای کمی آسیب‌دیده را جایگزین می‌کند. اگر ساختمان اصلی یک بنای
  سربازگیری از بین رفته باشد، روی محل تجمع آن نیز دوباره بنا می‌سازد.
ai_recruitinterval: تنظیم سربازگیری روی بیشترین سرعت
ai_recruitinterval_descr: 'فاصلهٔ سربازگیری همهٔ هوش‌ها را به کمترین مقدار می‌رساند؛ به سرعت موش یا ریچارد در بازی
  اصلی.

  نکته: با aiSwapper می‌توان سرعت سربازگیری هر هوش مصنوعی را دقیق‌تر از طریق AIC تنظیم کرد.'
ai_recruitstate_initialtimer: تنظیم زمان اولیه تا آغاز سربازگیری بر اساس AIC
ai_recruitstate_initialtimervalue_descr: تعداد ماه‌هایی را تعیین می‌کند که هوش مصنوعی فقط مدافع می‌گیرد، مگر آنکه
  سهمیهٔ نیروهای دفاعی‌اش پر شده باشد. در بازی اصلی این دوره ۶ ماه است.
ai_tethers: محدودکردن محل‌های بستن گاو به ۱۰ مورد برای هر ارباب هوش مصنوعی
ai_tethers_descr: هوش مصنوعی معمولاً برای هر معدن سنگ جدید یک محل بستن گاو می‌سازد، حتی اگر از سقف معمول ۱۰ مورد
  برای هر ارباب بیشتر شود. انباشته‌شدن این محل‌ها ممکن است سقف مسکن را پر کند و مانع ورود رعیت‌های جدید شود. این
  تنظیم از ساخت آن محل اضافی هنگام ایجاد معدن سنگ جلوگیری می‌کند.
ai_towerengines: افزایش سقف ماشین‌های محاصره روی برج‌های هوش مصنوعی
ai_towerengines_descr: هوش مصنوعی معمولاً حداکثر سه منجنیق برجی و سه بالیستا روی برج‌ها می‌سازد. این گزینه سقف هر
  نوع را به ۵ می‌رساند.
fix_apple_orchard_build_size: کاهش محدودهٔ ساخت باغ سیب
fix_apple_orchard_build_size_descr: پیش‌نمایش باغ سیب را با فضای واقعی آن پس از ساخت برابر می‌کند. این کار جا را
  حفظ می‌کند و یافتن محل مناسب روی چمن واحه را برای هوش مصنوعی آسان‌تر می‌سازد.
o_armory_marketplace_weapon_order_fix: یکسان‌کردن ترتیب سلاح‌ها در بازار و اسلحه‌خانه
o_armory_marketplace_weapon_order_fix_descr: ترتیب نمادهای سلاح در بازار را با اسلحه‌خانه یکسان می‌کند. هم صفحه‌های
  بازار و هم نمایش دستهٔ اصلی را شامل می‌شود.
o_change_siege_engine_spawn_position_catapult: ساخت ماشین محاصره در مرکز چادر آن
o_change_siege_engine_spawn_position_catapult_descr: 'در بازی اصلی ماشین‌های محاصره در بالای سمت راست چادر ساخت
  ظاهر می‌شوند. این گزینه آن‌ها را در مرکز چادر قرار می‌دهد.

  با این حال، خود چادر همچنان دقیقاً روی نقطهٔ تعیین‌شده در ویرایشگر AIV مرکز نمی‌شود.'
o_default_multiplayer_speed: تنظیم سرعت پیش‌فرض چندنفره
o_default_multiplayer_speed_descr: سرعت پیش‌فرض چندنفره را تعیین می‌کند. هنگام بارگذاری بازی نیز این مقدار به‌جای
  سرعت معمول ۴۰ اعمال می‌شود.
o_disable_border_scrolling: غیرفعال‌کردن پیمایش با بردن نشانگر به لبه
o_disable_border_scrolling_descr: 'بردن نشانگر به لبهٔ صفحه دیگر دوربین را حرکت نمی‌دهد.

  نکته: این گزینه برای حالت پنجره‌ای طراحی شده، زمانی که برای کارهای دیگر ماوس را از پنجره خارج می‌کنید.'
o_engineertent: جای‌گذاری پیوستهٔ چادرهای محاصره
o_engineertent_descr: اجازه می‌دهد ماشین‌های محاصره را پی‌درپی قرار دهید، بدون آنکه بازی پس از قراردادن چادر، انتخاب
  ماشین را خودکار لغو کند.
o_fast_placing: جای‌گذاری پیوستهٔ ساختمان‌های رایج
o_fast_placing_descr: 'با نگه‌داشتن دکمهٔ چپ ماوس، این سازه‌ها پی‌درپی قرار می‌گیرند:

  چاله‌های مرگ، چوب‌بری‌ها، چیزهای خوب و بد، آسیاب‌ها، چاه‌ها، نانوایی‌ها و خانه‌ها.'
o_firecooldown: تنظیم مدت مصونیت ساختمان پس از خاموش‌شدن آتش
o_firecooldown_descr: مدتی که ساختمان خاموش‌شده نمی‌تواند دوباره آتش بگیرد. در بازی اصلی ۲۰۰۰ تیک است؛ برابر با
  دو ماه و نیم.
o_fix_baker_disappear: رفع ناپدیدشدن نانواها
o_fix_baker_disappear_descr: نانواها وقتی در انبار هدف خود آرد پیدا نکنند، دیگر ناپدید نمی‌شوند.
o_fix_fletcher_bug: اصلاح مسیر ناکارآمد کمان‌سازها
o_fix_fletcher_bug_descr: کمان‌ساز پس از تحویل کمان یا زنبورک به اسلحه‌خانه، به‌جای بازگشت به کارگاه، مستقیماً برای
  برداشتن چوب چرخهٔ بعدی به انبار می‌رود.
o_fix_ladderclimb: حفظ مقصد حرکت پس از بالارفتن از نردبان
o_fix_ladderclimb_descr: نیروها پس از بالارفتن از نردبان مقصد اولیه را به یاد می‌آورند، به‌جای آنکه روی همان قطعهٔ
  دیوار گیر کنند و منتظر بمانند.
o_fix_map_sending: فعال‌کردن ارسال نقشه در چندنفره
o_fix_map_sending_descr: نام نقشهٔ ارسالی را کوتاه می‌کند تا ارسال نقشه دوباره امکان‌پذیر شود.
o_fix_moat_digging_unit_disappearing: رفع ناپدیدشدن نیروهای خندق‌کن
o_fix_moat_digging_unit_disappearing_descr: 'خطای ناپدیدشدن نیروها هنگام کندن خندق را رفع می‌کند.

  نکته: اگر وقتی روی زمین غیرقابل‌عبور ایستاده‌اند فرمان حرکت بدهید، هنوز ممکن است ناپدید شوند.'
o_fix_rapid_deletion_bug: رفع تکثیر منابع با تخریب سریع
o_fix_rapid_deletion_bug_descr: کلیک خودکار سریع دیگر یک ساختمان را چند بار تخریب نمی‌کند. بنابراین بیش از مقدار
  درنظرگرفته‌شدهٔ بازی، منابع پس نمی‌گیرید.
o_freetrader: بازار رایگان
o_freetrader_descr: هزینهٔ منابع بازار را حذف می‌کند تا هوش مصنوعی به‌دلیل نداشتن منابع ساخت بازار متوقف نشود. در
  چندنفره نیز اگر ساخت بازار فراموش شود، نیاز به شروع دوباره یا تخریب ساختمان‌ها برای چوب را از بین می‌برد.
o_gamespeed: گسترش محدودهٔ سرعت بازی
o_gamespeed_descr: 'تغییر سرعت را به این شکل ممکن می‌کند:

  - از ۱۰ تا ۹۰، با گام‌های ۵.

  - از ۹۰ تا ۲۰۰، با گام‌های ۱۰.

  - از ۲۰۰ تا ۱۰۰۰، با گام‌های ۱۰۰.

  مقادیر جدید فقط با کلیدهای + و - هنگام بازی در دسترس‌اند؛ لغزندهٔ منوی بازی تغییر نمی‌کند.'
o_healer: داروساز هم‌زمان درمانگر هم باشد
o_healer_descr: 'داروساز فعالانه سربازان، ماشین‌های محاصره، شهروندان و حیوانات زخمی را برای درمان جست‌وجو می‌کند
  و از نزدیک‌ترین‌ها شروع می‌کند. هر پویانمایی درمان تقریباً یک‌سوم سلامتی یک نیزه‌دار را بازمی‌گرداند. قدم‌زدن
  در باغ‌ها و بررسی ابرهای طاعون تغییر نمی‌کند.

  فقط پرسه‌زدن در قلعه تا وقتی مجروحی در اطراف هست کنار گذاشته می‌شود.'
o_increase_path_update_tick_rate: بررسی بیشتر مسیرهای در دسترس
o_increase_path_update_tick_rate_descr: 'در بازی اصلی مسیرهای تازه هر ۲۰۰ تیک بررسی می‌شوند و این اغلب ورود فوری
  نیروها پس از تخریب دروازه یا برج را به تأخیر می‌اندازد.

  فاصله را به ۵۰ تیک کاهش می‌دهد تا نیروها مسیرهای جدید را زودتر تشخیص دهند.'
o_keys: حرکت دوربین با WASD و فعال‌کردن ذخیرهٔ سریع
o_keys_descr: 'با WASD می‌توان دوربین را حرکت داد؛ Ctrl+S ذخیرهٔ سریع و Ctrl+L بارگذاری سریع انجام می‌دهد.

  نکته: با این گزینه نوشتن توضیحات نقشه و انتخاب اسلحه‌خانه با A عملاً ممکن نیست.'
o_moatvisibility: نمایش همیشگی خندق برنامه‌ریزی‌شده
o_moatvisibility_descr: خندق برنامه‌ریزی‌شده و ناتمام را حتی وقتی ابزار خندق یا هیچ نیرویی انتخاب نشده باشد نشان
  می‌دهد.
o_onlyai: فعال‌کردن حالت تماشاگر [احتمال خطا]
o_onlyai_descr: بازیکن انسانی را از جایگاه نخست حذف می‌کند تا نبرد حداکثر ۸ هوش مصنوعی را بدون دخالت تماشا کنید.
  ذخیره‌ها درست بارگذاری می‌شوند، اما اگر بازیکن انسانی در آن‌ها بوده باشد قابل‌کنترل نیست. گاهی اشیای تصادفی در
  سراسر نقشه ظاهر می‌شوند؛ این خطا فقط بصری است و با ذخیره، پایان‌دادن مأموریت و بارگذاری دوباره برطرف می‌شود.
o_override_identity_menu: افزودن قابلیت‌ها به منوی تنظیم هویت
o_override_identity_menu_descr: 'برای نبردهای آزاد از نوع عادی، انتخاب نیروی نزدیک‌زن و دورزن را به منوی تنظیم هویت
  اضافه می‌کند.

  نکته: برای تغییر بیشتر نیروهای آغازین، می‌توانید از ماژول startResources استفاده کنید.'
o_playercolor: جابه‌جایی رنگ این جایگاه با جایگاه نخست
o_playercolor_descr: رنگ جایگاه دیگر را با قرمز عوض می‌کند تا بازیکن رنگ دلخواهش را داشته باشد. انتخاب قرمز در اینجا
  اثری ندارد.
o_remove_right_click_context_menu: حذف منوی کلیک راست
o_remove_right_click_context_menu_descr: منوی کلیک راستی را حذف می‌کند که چرخش نقشه، کوتاه‌کردن دیوارها، بزرگ‌نمایی
  و صاف‌کردن را در اختیار می‌گذارد.
o_responsivegates: واکنش خودکار سریع‌تر دروازه‌ها
o_responsivegates_descr: 'دروازه‌ها اغلب هوش مصنوعی را محبوس و عبور را بیش از حد طولانی مسدود می‌کردند. اکنون هنگام
  نزدیک‌شدن دشمن دیرتر بسته و پس از رفع خطر زودتر باز می‌شوند.

  برد تشخیص از ۲۰۰ به ۱۴۰ و زمان بازشدن پس از ندیدن دشمن از ۱۲۰۰ به ۱۰۰ تیک کاهش می‌یابد.'
o_restore_arabian_engineer_speech: بازگرداندن صدای مهندسان عرب
o_restore_arabian_engineer_speech_descr: وقتی ارباب عرب را انتخاب کنید، مهندسان از جمله‌های عربی ضبط‌شدهٔ اصلی استفاده
  می‌کنند.
o_shfy: هماهنگ‌کردن با Stronghold 1
o_shfy_descr: 'موارد فهرست‌شده را با توازن Stronghold 1 هماهنگ می‌کند.

  توجه: هر تغییر بر اربابان هوش مصنوعی نیز اثر دارد و در بدترین حالت ممکن است آن‌ها را بی‌کارکرد کند.'
o_shfy_beer: پاداش محبوبیت آبجو
o_shfy_peasantspawnrate: نرخ ورود رعیت کنار آتش
o_shfy_religion: پاداش محبوبیت کلیسا و کلیسای جامع
o_shfy_resourcequantity: مقدار منابع تحویلی
o_stop_player_keep_rotation: چرخاندن قلعهٔ مرکزی بازیکن به سوی مرکز نقشه
o_stop_player_keep_rotation_descr: 'قلعه‌های بازیکنان مانند قلعه‌های هوش مصنوعی جهت می‌گیرند؛ آتش کنار قلعه به سمت
  لبهٔ بیرونی نقشه قرار می‌گیرد.

  نکته: ساختمان‌های دیگر نمی‌چرخند و ورودی‌ها و محل تجمعشان همچنان به گوشهٔ جنوب‌غربی اشاره می‌کند.'
o_xtreme: حذف نوار جادویی Crusader Extreme
u_arabwall: شمشیرزنان عرب دیوارها را سریع‌تر خراب کنند
u_arabwall_descr: در بازی اصلی شمشیرزنان عرب از همهٔ نیروهای نزدیک‌زن کندتر دیوار خراب می‌کنند. این گزینه سرعت آن‌ها
  را تقریباً دو برابر می‌کند و کمی بالاتر از نیزه‌داران قرار می‌دهد.
u_arabxbow: افزایش مقاومت شمشیرزنان عرب در برابر زنبورک
u_arabxbow_descr: شمشیرزنان عرب به‌جای ۳ اصابت، پس از ۶ اصابت زنبورک می‌میرند.
u_fireballistafix: بالیستاهای آتشین راهبان و تونل‌کن‌ها را خودکار هدف بگیرند
u_fix_applefarm_blocking: رفع گیرکردن کارگر باغ سیب
u_fix_applefarm_blocking_descr: ساخت بنا در سمت بالای چپ باغ، دیگر کارگر را هنگام جمع‌آوری سیب مسدود نمی‌کند.
u_fix_lord_animation_stuck_movement: بازنشانی پویانمایی ارباب پس از تخریب ساختمان
u_fix_lord_animation_stuck_movement_descr: وقتی ارباب از حرکت یا تخریب بنا دست می‌کشد، به حالت ایستاده برمی‌گردد.
  معمولاً ممکن بود در حالت خمیده به زمین گیر کند.
u_laddermen: افزایش مقاومت نردبان‌داران در برابر حملهٔ دوربرد
u_laddermen_descr: '- نردبان‌داران به‌جای ۵ تیر پس از ۱۲ تیر می‌میرند.

  - به‌جای ۲ اصابت زنبورک یا فلاخن، پس از ۵ اصابت می‌میرند.

  - هزینه‌شان به‌جای ۴ طلا، ۲۰ طلا است.'
u_spearmen: افزایش مقاومت نیزه‌داران در برابر حملهٔ دوربرد
u_spearmen_descr: '- نیزه‌داران به‌جای ۳ تیر پس از ۵ تیر می‌میرند.

  - به‌جای مرگ با یک تیر زنبورک، با سلامتی بسیار کم زنده می‌مانند.'
u_spearmen_run: نیزه‌داران به‌طور پیش‌فرض به‌جای راه‌رفتن بدوند
u_spearmen_run_descr: نیزه‌داران را مانند برده‌ها و گرزداران به‌طور پیش‌فرض دونده می‌کند.
u_tanner_fix: رفع بازگشت دباغ بدون گاو
u_tanner_fix_descr: اگر دباغ دیگری گاو هدف را بردارد، دباغ دیگر بدون گاو برنمی‌گردد. کمی صبر می‌کند و گاو دیگری
  را انتخاب می‌کند.
