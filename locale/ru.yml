Name: Неофициальный Stronghold Crusader Патч
ai: ИИ
balance_changes: Изменения баланса
bugfixes: Исправления ошибок
fixes: Исправления
improvements: Улучшения
misc: Разное
qol: Удобство игры
ai_housing: Настройка решения AI о строительстве и удалении домов
ai_housing_descr: 'Позволяет лордам ИИ разумнее управлять жильём: изменяет условия прекращения строительства домов и запрещает их снос. Обычно это помогает ИИ быстрее развиваться и получать новых работников в начале игры.'
ai_build_housing: Настроить свободные места для новых крестьян
ai_build_housing_descr: |-
  Определяет, когда ИИ прекращает строить дома, исходя из числа свободных мест для новых крестьян. В исходной игре значение равно 0: новые дома строятся только после заполнения всех имеющихся.
  Эта настройка также запрещает ИИ сносить лишние дома.
ai_campfire_housing: Настроить число безработных крестьян у костра
ai_campfire_housing_descr: |-
  Задаёт максимальное число крестьян у костра ИИ, при достижении которого он прекращает строить дома.
  Эта настройка также запрещает ИИ сносить лишние дома.
ai_delete_housing: Эта настройка только запрещает ИИ сносить лишние дома.
ai_demolish: Деактивировать снос за деньги AI Лордов
ai_demolish_descr: Когда ИИ чувствует угрозу, он сносит хозяйственные или оборонительные здания, чтобы быстро получить деньги на войска. Иногда это происходит без видимой причины, и снос таких зданий часто оказывается неудачной стратегией. Следующие виды сноса ради денег можно отключить.
ai_demolish_eco: экономические сооружения
ai_demolish_trapped: Если приложено
ai_demolish_walls: фортификационные сооружения
ai_access: Нет сноса недоступных зданий
ai_access_descr: "Предотвращает AI от разрушения зданий без доступа. Это должно остановить AI \nнепрерывного разрушения и восстановления зданий где нет доступа к ним."
ai_addattack: Увеличение скорости дополнительных атакующих войск
ai_addattack_descr: В Ваниле количество единиц атаки увеличивается на 5 единиц в среднем. Это значение для всех здесь.
ai_addattack_alt_descr: "В качестве альтернативы, дополнительное количество войск может быть выполнено в зависимости от число войск первой атаки. Поскольку это значение отличается для каждого AI следующие атаки будут масштабироваться, а не на одну и ту же величину для каждого лорда AI.\nПример: Масштабный коэффициент = 0,5\nВойска Султана атакуют = 10, 15, 20, 25, ...\nАтакующие войска Саладина = 50, 75, 100, 125, ... "
ai_assaultswitch: Нет изменения цели AI во время осады
ai_assaultswitch_descr: Лорды AI, которые иногда нападают на самого могущественного или самого слабого врага они переключают свою цель в середине продолжающегося нападения, и отправляют свои войска в другой замок. Это предотвращается с помощью этой настройки, как только начался штурм, т. е. на этапе сбора войск перед замком, изменения все еще могут произойти.
ai_attacklimit: Увеличение предела атакующих войск AI
ai_attacklimit_descr: Количество дополнительных единиц которые добавляются после первой атаки в Ваниле - до 200. Здесь вы можете изменить этот предел.
ai_attacktarget: Установить цель атаки AI
ai_attacktarget_descr: |-
  Позволяет переопределить способ выбора целей атаки для всех лордов ИИ.
  ПРИМЕЧАНИЕ: Модуль aiSwapper позволяет точнее настроить выбор цели каждого ИИ через параметры AIC.
ai_attacktarget_nearest: Ближайший враг
ai_attacktarget_richest: Богатый враг
ai_attacktarget_weakest: Слабый враг
ai_attackwave: Улучшение волны атаки
ai_attackwave_descr: |-
  AI в атаке в ванили посылает сразу столько же войск, как и тогда когда стены целые. Это заставляет единицы умирать в маленьких волнах
  когда у целевого замка много зданий прямо у его стен. Этот вариант позволяет подразделениям атаковать гражданские и фортификационные здания, а также
  стены которые уже атакованы одной единицей. Более того AI посылает больше войск к вражескому лорду, как только обнаруживает что стена разрушена.
ai_buywood: Купить достаточно древесины
ai_buywood_descr: "Чтобы воры стрельники не могли украсть древесину которую АI только что купил для здания.\n\t 2 единицы дополнительной деревесины AI теперь будет покупать для каждого здания."
ai_defense: Исправляет подкрепление войск обороны AI
ai_defense_descr: Исправлен баг, из-за которого AI не усиливал недостающие войска на стенах и башнях, пока оборонительные патрули все еще были вокруг.
ai_fix_crusader_archers_pitch: Исправляет европейских лучников которые не стреляют в нефтяной ров
ai_fix_crusader_archers_pitch_descr: Исправляет что (AI) европейские лучники не зажигают рвы, как арабские лучники когда на них попадают вражеские юниты.
ai_fix_laddermen_with_enclosed_keep: Исправить AI не использующий лестниц если они есть в наличии.
ai_fix_laddermen_with_enclosed_keep_descr: AI (в частности Змея) больше не прекращает использование Лестниц с Осадными орудиями, если они находится в замкнутом пространстве.
ai_nosleep: Отключить спящий режим из-за нехватки ресурсов
ai_nosleep_descr: |-
  AI обычно ставит свои обрабатывающие здания в сон поскольку необходимый ресурс отсутствует.
  Это делается без учета потери продуктов, и оружия которые находятся на пути в Оружейную.
  Эта функция может быть полностью отключена здесь.
ai_resources_rebuy: Улучшить пополнение ИИ нужными товарами
ai_resources_rebuy_descr: ИИ часто не докупает товары, даже если у него есть золото, из-за чего производство простаивает. Эта опция сокращает время ожидания при пустых запасах перед закупкой нужных товаров.
ai_noflour_maxtime_descr: Время в 1/12 месяца, через которое ИИ докупает 2 муки.
ai_noiron_maxtime_descr: Время в 1/12 месяца, через которое ИИ докупает 2 железа.
ai_nowood_maxtime_descr: Время в 1/12 месяца, через которое ИИ докупает 5 древесины.
ai_rebuild: Улучшенный ремонт AI
ai_rebuild_descr: AI будет ремонтировать руины башни слегка поврежденные стены, а также уничтожит инженерные и туннельные гильдии и нефтеперерабатывающие платформы, место сбора которых все еще существует. Кроме того, AI теперь может строить на платформе сбора карьеров.
ai_recruitinterval: Увеличенная скорость набора рекрутов
ai_recruitinterval_descr: Устанавливает интервал набора всех AI до самого низкого значения (Крыса/Ричард)
ai_recruitstate_initialtimer: Настройка первоначального времени вербовки AI в защиту
ai_recruitstate_initialtimervalue_descr: Установите это значение на количество месяцев, в течение которых AI будет вербовать исключительно войска обороны, если только он уже не заполнил всю оборону.
ai_tethers: Ограничить привязи волов до 10 на одного лорда ИИ
ai_tethers_descr: Обычно ИИ строит новую привязь волов для каждой новой каменоломни, даже если превышен обычный лимит в 10 привязей на лорда. Это может привести к избытку привязей и достижению лимита населения лорда ИИ, из-за чего перестанут появляться новые крестьяне. Эта опция отключает установку дополнительной привязи при строительстве новой каменоломни.
ai_towerengines: Увеличить лимит осадных машин на башнях ИИ
ai_towerengines_descr: Обычно ИИ строит на своих башнях не более трёх мангонелей и трёх баллист. С этой опцией лимит увеличивается до 5 машин каждого типа.
fix_apple_orchard_build_size: Размер площади яблоневой фермы
fix_apple_orchard_build_size_descr: Изменяет размер постройки яблоневого сада на размер который он занимает после расположение фермы. Это экономит место при строительстве ферм, и увеличивает скорость с которой AI может располагать эти фермы.
o_armory_marketplace_weapon_order_fix: Исправить оружейный склад/рыночное оружие, чтобы соответствовать порядку
o_armory_marketplace_weapon_order_fix_descr: Изменение порядка иконок оружия в Оружейной и на Рынке, чтобы они располагались в одинаковом порядке. Также перемещает кожаную броню между булавой и арбалетом, а металлическую броню между пиками и мечом для более легкого доступа во время прокрутки предметов на Рынке.
o_change_siege_engine_spawn_position_catapult: Положение спавна осадных механизмов посредине
o_change_siege_engine_spawn_position_catapult_descr: Осадные механизмы теперь появляется по центру , вместо появления в верхнем углу палатки.
o_default_multiplayer_speed: Установить скорость мультиплеера по умолчанию.
o_default_multiplayer_speed_descr: Позволяет задать стандартную скорость для сетевой игры, которая также применяется при загрузке сохранения вместо стандартного значения 40.
o_disable_border_scrolling: Deaktiviere Scrollen am Bildschirmrand
o_disable_border_scrolling_descr: Bewegen des Mauszeigers zum Bildschirmrand bewegt nicht mehr die Ansicht.
o_engineertent: Нету выбора осадной палатки
o_engineertent_descr: |-
  С помощью этой настройки игра не отменяет выбранное вами осадное оборудование после размещения больше одной палатки
  Таким образом вы можете создать несколько палаток одну за другим без необходимости повторного выбора одного, и того же осадного оборудования.
o_fast_placing: Fast placing
o_fast_placing_descr: |-
  При удержании левой кнопки мыши непрерывно размещаются следующие постройки:
  волчьи ямы, хижины лесорубов, хорошие и плохие вещи, мельницы, колодцы, пекарни и дома.
o_firecooldown: Настроить время защиты потушенных зданий от огня
o_firecooldown_descr: Время, в течение которого потушенные здания не могут загореться снова. В оригинальной игре это 2000 игровых тиков, что равно 2,5 месяца.
o_fix_baker_disappear: Исправить ошибку исчезновения пекаря
o_fix_baker_disappear_descr: Исправляет ошибку при которой пекарни исчезали бы если бы пекари не нашли муку на складе запасов.
o_fix_fletcher_bug: Исправляет баг стрельника
o_fix_fletcher_bug_descr: Исправление поведения, при котором стрельник возвращается на рабочее место после сдачи на хранение лука/арбалета вместо того чтобы идти прямо на склад.
o_fix_ladderclimb: Исправить ошибку подъёма по лестнице
o_fix_ladderclimb_descr: Отряды больше не забывают о своем предназначении после восхождения на стену, и они больше не начнут подниматься или спускаться вниз сразу же после того, как они только что поднялись.
o_fix_map_sending: Enable map sending in multiplayer
o_fix_map_sending_descr: Reduces the length of the sent map name, to make map sending possible again!
o_fix_moat_digging_unit_disappearing: Исправляет исчезания юнитов при копании рва
o_fix_moat_digging_unit_disappearing_descr: Исправлена ошибка при которой копатели рва исчезали случайно во время раскопок. Обратите внимание что они все равно могут исчезнуть, если вы прикажете им двигаться во время раскопок, и они случайно встанут на непешеходную плитку!
o_fix_rapid_deletion_bug: Fix resources rapid deletion
o_fix_rapid_deletion_bug_descr: Deleting buildings with a fast auto clicker no longer gives resources for more than one deletion.
o_freetrader: Бесплатный рынок
o_freetrader_descr: Поскольку АI иногда играет сам, когда он находится далеко от леса и его рынок уничтожен. С этим параметром рынок станет бесплатным чтобы предотвратить это.
o_gamespeed: Расширенные ограничения скорости игры
o_gamespeed_descr: |-
  Позволяет изменять скорость игры следующим образом:
  - От 10 до 90 с шагом 5
  - От 90 до 200 с шагом 10
  - От 200 до 1000 с шагом 100
  Новые значения доступны только в игре с помощью клавиш + и -, ползунок в игровом меню остаётся без изменений.
o_healer: Целитель лечит раненых солдат
o_healer_descr: Лекарь из аптеки теперь активно ищет раненых солдат, осадные машины, мирных жителей и животных, чтобы лечить их. Ближайшие цели лечатся первыми. За каждую анимацию лечения восстанавливается около 1/3 здоровья копейщика. Прогулки по садам и рассеивание облаков чумы сохраняются. Пропускаются только обычные прогулки по замку, пока поблизости есть раненые цели.
o_increase_path_update_tick_rate: Более частая проверка доступного пути
o_increase_path_update_tick_rate_descr: |-
  В ваниле это заняло 200 игровых тиков, чтобы проверить новые пути часто останавливая юнитов, чтобы AI перейти в замок после уничтожения ворот или башни немедленно.
   Доступность рассчитывается теперь каждые 50 игровых тиков, что позволяет юнитам реализовывать новые пути быстрее.
o_keys: WASD-Кнопки и быстрые сохранения
o_keys_descr: Клавиши WASD можно использовать для перемещения с этой настройкой, а также CTRL-S и CTRL-L для быстрого сохранения и загрузки соответственно.
o_moatvisibility: Всегда показывать планированый ров
o_moatvisibility_descr: Ваш собственный,но не выкопанный ров всегда будет показан с этой опцией, даже если вы отмените выбор размещения рва.
o_onlyai: Активировать Режим - Зрителя (Только AI) [Возможны баги]
o_onlyai_descr: Убирает игрока 1, чтобы вы могли видеть только 8 AI в одном и том же режиме. Сохранения игры теперь правильно загружаются в этом режиме. Иногда ошибка появляется, когда случайные объекты появляются на всей карте. Это просто визуальный баг и его можно убрать сохранив игру, завершая миссию и перезагружая сохранить файл.
o_override_identity_menu: Переопределить меню "Set-up Identity", добавляя новые функции.
o_override_identity_menu_descr: Добавляет выбор юнитов дальнего и ближнего боя в меню Set-up Identity". ТОЛЬКО ДЛЯ ОБЫЧНОГО ИГРОВОГО РЕЖИМА!
o_playercolor: Изменить цвет Игрока 1
o_playercolor_descr: Меняет цвет другого слота местами с красным, чтобы игрок мог играть выбранным цветом. Выбор красного здесь ни на что не влияет.
o_remove_right_click_context_menu: Убрать контекстное меню по правому клику
o_remove_right_click_context_menu_descr: Removes right click context menu where you can rotate the map, lower walls, zoom and flatten.
o_responsivegates: Быстрая реакция юнитов на врагов
o_responsivegates_descr: Ворота закрываются позже при приближении врагов и быстрее открываются автоматически, когда опасность минует. Дистанция обнаружения врагов снижена с 200 до 140, а задержка повторного открытия ворот при отсутствии врагов сокращена с 1200 до 100 тиков.
o_restore_arabian_engineer_speech: Восстановление арабской речи инженера
o_restore_arabian_engineer_speech_descr: |-
  Позволяет инженерам говорить на изначально записанных арабских голосовых дорожках, когда игрок использует арабского лорда.

  Голосовые линии не сильно отличаются друг от друга, так что через некоторое время они могут стать раздражающими.
o_shfy: Strongholdify
o_shfy_descr: |-
  Приводит перечисленные параметры к балансу Stronghold 1.
  Внимание: каждое изменение влияет и на лордов ИИ, а в худшем случае может сделать их беспомощными!
o_shfy_beer: Бонус за популярность от пива
o_shfy_peasantspawnrate: Скорость появления крестьян (спавн)
o_shfy_religion: Бонус за популярность от собора налогов и церкви
o_shfy_resourcequantity: Количество предоставленных ресурсов
o_stop_player_keep_rotation: Поворот крепости игрока
o_stop_player_keep_rotation_descr: Крепость игрока вращается таким же образом как и крепости AI. Точней стоит лицом к костру AI , а другой стороной к краю карты
o_xtreme: Убраны значки магии в Stronghold Crusader Extreme
u_arabwall: Арабские мечники быстрее разрушают стены
u_arabwall_descr: В оригинальной игре арабские мечники разрушают стены медленнее любой другой бойцовской единицы ближнего боя. Эта настройка примерно удваивает скорость разрушения стен, делая их немного быстрее копейщиков.
u_arabxbow: Повышенная защита арабских мечников от арбалетных болтов
u_arabxbow_descr: ' - Арабские мечники умирают после 6 стрел из арбалета вместо 3'
u_fireballistafix: Огненные баллисты стреляют в монахов и тунелекопателей
u_fix_applefarm_blocking: Исправить блокировку яблочных ферм
u_fix_applefarm_blocking_descr: Яблочные фермеры больше нельзя блокировать, размещая здания в верхней левой части фермы.
u_fix_lord_animation_stuck_movement: Исправляет анимацию замирания Лорда
u_fix_lord_animation_stuck_movement_descr: Исправляет анимацию замирания Лорда когда тот стоит, либо когда разрушает здание.
u_laddermen: Увеличенная броня Крестьян с лесницами против дальних войск
u_laddermen_descr: |2-
   - Крестияне с лестницами умирают после 12 стрел  вместо 5
    - Крестияне с лестницами умирают после 5 выстрелов арбалетов или пращников вместо 2
    - Крестияне с лестницами стоят 20 золотых вместо 4
u_spearmen: Увеличенная броня копейщиков против урона дальних юнитов
u_spearmen_descr: |2-
   - Копейщики умирают после 5 попаданий стрел из лука, вместо 3
    - Копейщики едва выдерживали один выстрел из арбалета, вместо того чтобы умереть от одного выстрела
u_spearmen_run: Копейщики бегут по умолчанию вместо того, чтобы ходить пешком.
u_spearmen_run_descr: Вместо медленной ходьбы копейщики бегут медленно.
u_tanner_fix: Исправляет кожевников которые получают одну и ту же корову
