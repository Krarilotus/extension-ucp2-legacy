Name: Nem hivatalos Crusader Patcher
ai: MI
balance_changes: Egyensúlymódosítások
bugfixes: Hibajavítások
fixes: Javítások
improvements: Fejlesztések
misc: Egyéb
qol: Kényelmi funkciók
ai_housing: Házak okosabb építése
ai_housing_descr: 'Az MI-urak okosabban kezelik a lakóházaikat: módosíthatók a házépítés leállításának feltételei, és megakadályozható a házak lebontása. Így az MI általában gyorsabban terjeszkedik és hamarabb jut új dolgozókhoz a játék elején.'
ai_build_housing: Szabad férőhelyek beállítása az új parasztoknak
ai_build_housing_descr: |-
  A még szabad férőhelyek száma alapján határozza meg, mikor hagyja abba az MI a házépítést. Az alapjátékban ez az érték 0, ezért az MI csak akkor épít új házat, ha az összes meglévő megtelt.
  Ez a beállítás a felesleges házak lebontását is megakadályozza.
ai_campfire_housing: A tábortűznél várakozó parasztok helyének beállítása
ai_campfire_housing_descr: |-
  Beállítja, legfeljebb hány paraszt lehet az MI tábortüzénél, mielőtt az MI leállítja a további házépítést.
  Ez a beállítás a felesleges házak lebontását is megakadályozza.
ai_delete_housing: Ez a beállítás kizárólag az MI felesleges házainak lebontását akadályozza meg.
ai_demolish: Az MI Lord lerombol mindent hogy pénzhez jusson deaktiválása
ai_demolish_descr: Ha az MI veszélyben érzi magát, gazdasági vagy védelmi épületeket bont le, hogy gyorsan pénzt szerezzen katonákra. Ez néha látható ok nélkül is megtörténik, és gyakran rossz stratégia. Az alábbi, pénzszerzés céljából végzett bontások kikapcsolhatók.
ai_demolish_eco: Ipari épületek
ai_demolish_trapped: Ha bezárva
ai_demolish_walls: Várépületek
ai_access: Az elérhetetlen épületek ne kerüljenek lerombolásra
ai_access_descr: Megakadályozza azt, hogy az MI lerombolja azt az épületet amihez nem lehet hozzáférni. Ezáltal kijavítható az a hiba, hogy az MI ne építse meg és rombolja le újra és újra mindig azt az épületet amihez nem tudnak eljutni.
ai_addattack: Megnövelt további támadó egységek mértéke
ai_addattack_descr: Az eredeti játékban minden egyes támadás után az egységek száma a következő támadáskor átlagosan 5 egységgel lesz megnövelve. Ez az érték minden MI Lordnak ugyanannyi és itt tudod megváltoztatni.
ai_addattack_alt_descr: |-
  Alternatív megoldásként, a további csatlakozó egységek számát az első támadás erősségétől függetlenné lehet tenni. De mivel minden MI Lord különböző számú egységet használ az első támadásnál, ezzel együtt a következő támadások is skálázódnak ahelyett, hogy minden MI Lordnak ugyanaz az értéke lenne.
  Például: Skálázási faktor = 0,5
  Szultán támadásainak száma = 10, 15, 20, 25, ...
  Szaladin támadásainak száma = 50, 75, 100, 125, ...
ai_assaultswitch: Ostrom közben ne változtasson az MI támadási-célpontot
ai_assaultswitch_descr: Azok az MI Lordok akik a legerősebbet vagy a leggyengébbet támadták meg, néha hajlamosak voltak a támadás közepén célpontot változtatni, és az egységeiket elküldeni a másik várhoz. Ezzel a beállítással, ez már nem fordul elő, mihelyst a támadást megkezdte, viszont a vár előtti egységek gyülekezésekor még előfordulhat, hogy célpontot vált.
ai_attacklimit: Megnövelt támadó egység limit az MI Lordoknak
ai_attacklimit_descr: Az eredeti játékban a további egységek limitje, akik az első támadás után csatlakoznak 200-ra van korlátozva. Itt tudod megváltoztatni ezt a korlátozást.
ai_attacktarget: MI támadási-célpont beállítása
ai_attacktarget_descr: |-
  Felülírhatod, hogyan választanak támadási célpontot az MI-urak.
  MEGJEGYZÉS: Az aiSwapper modullal az egyes MI-k célpontválasztása részletesebben is beállítható az AIC-paramétereken keresztül.
ai_attacktarget_nearest: A legközelebbi ellenség
ai_attacktarget_richest: A leggazdagabb ellenség
ai_attacktarget_weakest: A leggyengébb ellenség
ai_attackwave: Támadási hullámok feljavítása
ai_attackwave_descr: Az eredeti játékban az MI mindig csak annyi egységet küld el egyszerre amennyi elérhető várfal van. Azok a várak amik épületekkel vannak körülépítve, azokat az egységek csak elvétve támadják meg. Ezzel a beállítással az egységek az épületeket és az ostromsátrakat is megtámadják illetve azt a várfalat is amit már egy másik támadó egység rombol. Továbbá az MI mostantól több egységet küld az ellenséges vártoronyra, amint észrevesz egy oda vezető utat.
ai_buywood: Elegendő fa vásárlása
ai_buywood_descr: Ahhoz hogy az íjkészítők stb. ne vigyék el mindig a megvásárolt fát. Az MI ezzel a beállítással mindig 2 fával többet vesz, mint ami szükséges az épületek építéséhez.
ai_defense: Várvédő egységek megerősítése kijavítva
ai_defense_descr: Kijavítja azt a hibát, ami megakadályozza az MI-t abban, hogy a hiányzó egységekkel megerősítse a várfalat és a tornyot, ameddig rendelkezik még védekező-járőröző egységekkel.
ai_fix_crusader_archers_pitch: MI keresztes íjász nem gyújtja be az olajosárkot javítás
ai_fix_crusader_archers_pitch_descr: Az MI keresztes íjász most már begyújtja az olajosárkot, úgy mint az arab íjász amikor ellenséges egység lép az olajosárokra.
ai_fix_laddermen_with_enclosed_keep: Javított létrahasználat
ai_fix_laddermen_with_enclosed_keep_descr: Ezzel a hibajavítással azok az MI-k, akiknek a vártornyuk körül van zárva, továbbra is tudják az ostromegységeik használni a létrahordozók létráit (az eredeti játékban ez csak a Kígyót érinti).
ai_nosleep: Ha nincs elég erőforrás, szünetel a munka deaktiválása
ai_nosleep_descr: Általában az MI szünetelteti a munkát az ipari épületeinél, ha a szükséges erőforrás már nem áll rendelkezésére a raktárban. Eközben a termék kárba veszik amit pl. éppen a fegyverraktárba visznek. Ezt a funkciót itt teljesen ki lehet kapcsolni.
ai_resources_rebuy: Az MI szükséges áruk utánpótlásának javítása
ai_resources_rebuy_descr: Az MI sokszor akkor sem pótolja a nyersanyagokat, ha van rá aranya, így a termelési láncai leállnak. Ez az opció csökkenti az időt, amennyit az MI üres raktárnál vár a szükséges áruk újravásárlása előtt.
ai_noflour_maxtime_descr: Idő 1/12 hónapban, amely után az MI 2 lisztet újravásárol.
ai_noiron_maxtime_descr: Idő 1/12 hónapban, amely után az MI 2 vasat újravásárol.
ai_nowood_maxtime_descr: Idő 1/12 hónapban, amely után az MI 5 fát újravásárol.
ai_rebuild: Kijavított MI javítások
ai_rebuild_descr: Ezzel a beállítással az MI Lordok megjavítják a toronyromokat is, enyhén megrongált várfalakat, továbbá mérnökök-, alagútásók céhet és olajfőző kunyhót ha a helyük megmaradt. Továbbá az MI most már képes építeni a kőfejtők helye felett is.
ai_recruitinterval: Megnövelt toborzási sebesség
ai_recruitinterval_descr: Átállítja minden MI Lordnak a toborzási intervallumát a legkisebb értékre. (Patkány/Richárd szint)
ai_recruitstate_initialtimer: Az MI a megadott ideig az AIC paraméterek alapján toborozzon
ai_recruitstate_initialtimervalue_descr: Az értéknek add meg azon hónapok számát, amikor az MI az AIC fájlban megadott toborzási sebeséggel toboroz kizárólag védekező egységeket, ha már teljesen megerősítette a védelmét, akkor támadó egységeket fog toborozni
ai_tethers: Ökörkarámok korlátozása MI-lordként legfeljebb 10-re
ai_tethers_descr: Az MI általában minden új kőfejtőhöz épít egy új ökörkarámot, még akkor is, ha ezzel túllépi a lordonkénti szokásos 10-es korlátot. Ez ökörkarám-túlzáshoz vezethet, elérve az MI-lord lakossági korlátját, így nem születnek új parasztok. Ezzel a beállítással letiltható ennek az extra ökörkarámnak az elhelyezése új kőfejtő építésekor.
ai_towerengines: Az MI tornyaira építhető ostromgépek számának növelése
ai_towerengines_descr: Az MI általában legfeljebb három kővetőt és három ballisztát épít a tornyaira. Ezzel a beállítással ez a korlát géptípusonként 5-re nő.
fix_apple_orchard_build_size: Almáskert építési méretének csökkentése
fix_apple_orchard_build_size_descr: Az almáskert elhelyezése előtt az előnézeti mérete nagyobb volt, mint amekkora valójában az almáskert az elhelyezés után. Ez a hiba kijavításra került. Ezzel a beállítással több szabad hely marad az almáskertek építésekor és megnöveli az MI mezőgazdasági épületek építésének rátáját.
o_armory_marketplace_weapon_order_fix: Megegyező fegyver sorrend a fegyverraktár/piacban
o_armory_marketplace_weapon_order_fix_descr: Újrarendezi a fegyver ikonokat a fegyverraktárban és a piacban, hogy egyforma legyen a sorrend. A bőrpáncél a buzogány és számszeríj között lesz, míg a vaspáncél a dárda és kard között, hogy könnyebben megtalálható legyen a piacban való kereséskor.
o_change_siege_engine_spawn_position_catapult: Elkészült ostromgépek középre pozicionálása
o_change_siege_engine_spawn_position_catapult_descr: Az elkészült ostromgépek a sátor közepénél jelennek meg a sátor jobb felső sarka helyett.
o_default_multiplayer_speed: Többjátékos mód alapsebességének beállítása
o_default_multiplayer_speed_descr: Lehetővé teszi az alapértelmezett többjátékos sebesség beállítását, amely betöltéskor is érvényesül az alapértelmezett 40-es sebesség helyett.
o_disable_border_scrolling: Deaktiviere Scrollen am Bildschirmrand
o_disable_border_scrolling_descr: Bewegen des Mauszeigers zum Bildschirmrand bewegt nicht mehr die Ansicht.
o_engineertent: Ostromgépek kijelölve maradnak
o_engineertent_descr: Ezzel a beállítással az utoljára építésre kiválasztott ostromgép marad kijelölve ha több mérnököt kiválasztottál, így több ostromsátrat is lehet egymás után építeni.
o_fast_placing: Fast placing
o_fast_placing_descr: |-
  A bal egérgomb nyomva tartásával folyamatosan helyezhetők el a következő építmények:
  gyilkos vermek, favágókunyhók, jó és rossz dolgok, malmok, kutak, pékségek és kunyhók.
o_firecooldown: Eloltott épületek tűzálló idejének beállítása
o_firecooldown_descr: Az az időtartam, amely alatt az eloltott épületek nem gyulladhatnak ki újra. Az alapjátékban ez 2000 játéktick, ami 2 és fél hónapnak felel meg.
o_fix_baker_disappear: Eltűnő pék hibajavítás
o_fix_baker_disappear_descr: Kijavítja azt a hibát, amikor a pék eltűnik ha a raktárban nem találja meg a kiválasztott helyen a lisztet.
o_fix_fletcher_bug: Íjkészítő hibajavítás
o_fix_fletcher_bug_descr: Kijavítja az íjkészítő azon viselkedését, miszerint visszatér a munkahelyére ha leszállított egy íjat/íjpuskát, ahelyett hogy egyenesen a raktárhoz menne.
o_fix_ladderclimb: Létramászás hibajavítás
o_fix_ladderclimb_descr: Az egységek mászás után nem felejtik el a számukra adott parancsot, és többé nem fognak lemászni miután már felmásztak.
o_fix_map_sending: Enable map sending in multiplayer
o_fix_map_sending_descr: Reduces the length of the sent map name, to make map sending possible again!
o_fix_moat_digging_unit_disappearing: Eltűnő árokásó egység hibajavítás
o_fix_moat_digging_unit_disappearing_descr: 'Kijavítja azt a hibát, amikor árokásás közben véletlenszerűen eltűnik az árkot ásó egység. Megjegyzés: Az egység még mindig eltűnhet, ha árokásás közben elküldöd máshova és éppen egy nem járható helyen van!'
o_fix_rapid_deletion_bug: Fix resources rapid deletion
o_fix_rapid_deletion_bug_descr: Deleting buildings with a fast auto clicker no longer gives resources for more than one deletion.
o_freetrader: Ingyen piac
o_freetrader_descr: Mivel néha az MI magának add sakk-mattot, ha nincs elég fája és a piacát lerombolták. Itt tudod beállítani hogy a piac építése ingyenes legyen.
o_gamespeed: Bővített játéksebesség limit
o_gamespeed_descr: |-
  A játéksebességet mostantól a következőképpen lehet megváltoztatni:
   - 10-től 90-ig 5 lépésben
   - 90-től 200-ig 10 lépésben
   - 200-tól 1000-ig 100 lépésben
  Az új értékek elérhetők a játékban a +- billentyűk segítségével, a csúszka a játékmenüben változatlanul maradt.
o_healer: A gyógyító ellátja a sérülteket
o_healer_descr: A gyógyszertár gyógyítója mostantól megkeresi a sérült harcosokat, civileket, állatokat és meggyógyítja őket. A hozzá legközelebb lévő célpontokat gyógyítja először. Minden gyógyító animációval kb. egy lándzsás 1/3 életerejét állítja helyre. A kertekben való mászkálás és a pestisfelhő felkeresése ez által nem lesz lecserélve! Csak a várban való mászkálása lesz kihagyva, ha van sebesült a hatótávolságán belül.
o_increase_path_update_tick_rate: Elérhető útvonalak gyakoribb ellenőrzése
o_increase_path_update_tick_rate_descr: |-
  Az eredeti játékban minden 200. játékidő tick után kerültek ellenőrzésre az új útvonalak, ami azt eredményezte, hogy az egységek nem tudtak azonnal bemenni a várba miután lerombolták a kaput vagy a tornyot.

  Az elérhető útvonalakat mostantól minden 50. játékidő tick után ellenőrzi, így lehetővé téve hogy az egységek sokkal gyorsabban 'realizálják' az elérhető új útvonalat.
o_keys: WASD billentyűk és gyorsmentés
o_keys_descr: |-
  Ezzel a beállítással aktiválva lesznek a WASD billentyűk a kamerához.
  Ezenkívül a CTRL-S és a CTRL-L billentyűkkel lehet gyorsmentést létrehozni és betölteni.
o_moatvisibility: Mindig mutassa a tervezett várárkot
o_moatvisibility_descr: Ezzel a beállítással a lehelyezett, de a még nem felásott várárok mindig látható, még akkor is ha nincs kiválasztva a várárokásás.
o_onlyai: Nézői mód aktiválása [hiba előfordulhat]
o_onlyai_descr: Eltávolítja az 1.játékost a nézői módhoz és így 8 MI harcolhat egymással az Egyedi játék módban. Az elmentett játék most már rendesen működik ebben a módban is. Néha előfordulhat olyan hiba, hogy az egész térképen véletlenszerűen feltűnhetnek tárgyak. De ezek csak vizuálisan jelennek meg és egyszerűen megoldható a Játék mentése -> Küldetés befejezése -> Játék betöltésével.
o_override_identity_menu: Új beállítások hozzáadása a 'Játékos szerkesztése' menühöz
o_override_identity_menu_descr: Távolsági és közelharci egységek kiválasztási lehetőségét adja hozzá a 'Játékos szerkesztése' menüponthoz. CSAK NORMÁL JÁTÉK MÓDHOZ!
o_playercolor: Játékos 1 színcsere
o_playercolor_descr: Felcseréli a másik játékoshely színét a pirossal, hogy a játékos a kívánt színnel játszhasson. A piros kiválasztásának itt nincs hatása.
o_remove_right_click_context_menu: Jobb kattintásos helyi menü eltávolítása
o_remove_right_click_context_menu_descr: Removes right click context menu where you can rotate the map, lower walls, zoom and flatten.
o_responsivegates: A várkapuk gyorsabban reagálnak az ellenséges egységekre
o_responsivegates_descr: A várkapuk mostantól később záródnak be ha ellenség van a közelben és automatikusan gyorsabban kinyílnak, ha már nincs közelben ellenség. A távolság ami szükséges az ellenségnek, hogy a várkapu automatikusan bezáródjon, 200-ról 140-re lett csökkentve. Az idő amikor a várkapu ismét kinyílik, mihelyst nincs ellenség a közelben, 1200-ról 100-ra lett csökkentve.
o_restore_arabian_engineer_speech: Az arab mérnök arabul beszél
o_restore_arabian_engineer_speech_descr: |-
  Ha a játékos az Arab Lord-ot választja, akkor a mérnök beszédekor az eredeti felvett arab hangfájlt használja.

  Nincs túl sok variáció ezekben a hangfájlokban, így egy idő után zavaró lehet.
o_shfy: Strongholdify
o_shfy_descr: |-
  A felsorolt jellemzőket a Stronghold 1 egyensúlyához igazítja.
  Figyelem: minden változtatás az MI-urakat is érinti, és a legrosszabb esetben működésképtelenné teheti őket!
o_shfy_beer: Sör általi népszerűségi bónusz
o_shfy_peasantspawnrate: Parasztok érkezésének sebessége
o_shfy_religion: Templom és katedrális általi népszerűségi bónusz
o_shfy_resourcequantity: Leszállított erőforrások mennyisége
o_stop_player_keep_rotation: Játékos vártornyok elforgatása
o_stop_player_keep_rotation_descr: A játékosok vártornyai mostantól ugyanolyan módon lesznek elforgatva, mint az MI vártornyok. A tábortűz mindig a térkép legközelebbi széle felé néz.
o_xtreme: Varázserő-sáv eltávolítása az Extreme kiegészítőből.
u_arabwall: Az arab kardforgatók gyorsabban rombolják a falakat
u_arabwall_descr: Az alapjátékban az arab kardforgatók minden más közelharci egységnél lassabban rombolják a falakat. Ez a beállítás nagyjából megduplázza a sebességüket, így kissé gyorsabbak lesznek a lándzsásoknál.
u_arabxbow: Az arab kardforgatók erősebb védelme a számszeríjlövedékek ellen
u_arabxbow_descr: ' - Az arab szablyás 3 helyett 6 számszeríj nyílvessző találat után hal meg'
u_fireballistafix: A tűzhajítógépek lőnek a szerzetesekre és az alagútásókra
u_fix_applefarm_blocking: Almáskert blokkolása javítás
u_fix_applefarm_blocking_descr: Az almatermesztő nem várakozik, ha az almáskert bal felső részénél lévő utat blokkolja valami.
u_fix_lord_animation_stuck_movement: Lord animáció visszaállítása az épületek lerombolása után
u_fix_lord_animation_stuck_movement_descr: Ezzel a változtatással egy épület lerombolása után a Lord a kiindulási animációra tér vissza. Mostantól nem marad a leromboló animációban.
u_laddermen: Megnövelt védelem a létrás egységnek a távolsági egységek ellen
u_laddermen_descr: |2-
   - A létrás egység 5 helyett 12 nyíl találat után hal meg
   - A létrás egység 2 helyett 5 számszeríj nyílvessző találat vagy parittyakő találat után hal meg
   - A létrás egység 4 helyett 20 aranyba kerül
u_spearmen: Megnövelt védelem a lándzsás egységnek a távolsági egységek ellen
u_spearmen_descr: |2-
   - A lándzsás egység 3 helyett 5 nyíl találat után hal meg
   - A lándzsás egység épphogy túlél egy számszeríj nyílvessző találatot
u_spearmen_run: A lándzsás egység sétálás helyett alapból fut
u_spearmen_run_descr: A lándzsás egység lassú sétálás helyett alapból futni fog. A lándzsás olyan gyorsan fut, mint egy rabszolga vagy buzogányos.
u_tanner_fix: A tímárok ugyanazt a tehenet választják javítás
u_tanner_fix_descr: A tímárok mostantól nem fognak tehén nélkül visszatérni, ha egy másik tímár már elvitte az általuk kiválasztott tehenet. Mostantól várakoznak egy ideig és elvisznek egy másikat.
